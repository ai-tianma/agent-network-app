name: release-desktop-auto-update

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit on main to release
        required: true
        type: string
      publish:
        description: Create the draft GitHub Release. False builds and smoke-tests only; it does not upload a Release.
        required: false
        default: true
        type: boolean
      include_linux:
        description: Also build and verify Ubuntu 24.04 amd64 (deferred by default)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-desktop-auto-update
  cancel-in-progress: false

jobs:
  build-release:
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        # Linux is opt-in, not a skipped matrix job that delays the primary pair.
        # When requested it still uses the production updater/signing/retention gates.
        include: ${{ fromJSON(inputs.include_linux && '[{"platform":"macos-14","args":"--bundles app,dmg"},{"platform":"windows-latest","args":"--bundles nsis,msi"},{"platform":"ubuntu-24.04","args":"--bundles deb"}]' || '[{"platform":"macos-14","args":"--bundles app,dmg"},{"platform":"windows-latest","args":"--bundles nsis,msi"}]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Require exact merged commit
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.commit }}'
          resolved="$(git rev-parse HEAD)"
          # Separate tests. macOS /bin/bash 3.2 treats `[[ a =~ re && b == c ]]`
          # as success, so a short SHA or a different HEAD would pass.
          [[ "$requested" =~ ^[0-9a-f]{40}$ ]]
          [[ "$resolved" == "$requested" ]]
          # checkout above has full history. Do not re-shallow main: a release
          # SHA can legitimately precede the current tip while awaiting approval.
          git fetch origin main
          git merge-base --is-ancestor "$resolved" origin/main

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev file \
            gnome-keyring dbus-x11 xvfb
          command -v dpkg-deb
          command -v gnome-keyring-daemon
          command -v dbus-run-session
          command -v xvfb-run

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - name: Use Bash 4+ for macOS release tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # npm test executes the checked-out android publish gate. That file on
          # the release SHA still uses one `[[ =~ && == ]]`, which /bin/bash 3.2
          # accepts for a short SHA. Bash 4+ rejects it. Prepend that bash so
          # the test's `bash` is not /bin/bash.
          prefix="$(brew --prefix)"
          bin="$prefix/bin/bash"
          if [ ! -x "$bin" ] || ! "$bin" -c '[[ ${BASH_VERSINFO[0]} -ge 4 ]]'; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install bash
          fi
          "$bin" -c '[[ ${BASH_VERSINFO[0]} -ge 4 ]]'
          if "$bin" -c 'set -euo pipefail; short=01234567; full=0123456789abcdef0123456789abcdef01234567; [[ "$short" =~ ^[0-9a-f]{40}$ && "$full" == "$short" ]]'; then
            echo "::error::bash at $bin still accepts a short SHA"
            exit 1
          fi
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" --version
      - run: npm test
      - run: npm run typecheck
      - run: npx expo export -p web
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned local CommHub sidecar
        shell: bash
        run: |
          npm ci --prefix local-hub-sidecar --ignore-scripts
          npm run build:local-hub-sidecar
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npx tauri icon assets/icon.png
      - name: Check Rust app sources
        working-directory: src-tauri
        run: cargo check --locked
      - name: Verify native credential-store persistence
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ] && [ "${ANET_LINUX_KEYRING_ACTIVE:-}" != "1" ]; then
            export ANET_LINUX_KEYRING_ACTIVE=1 ANET_ISOLATED_KEYRING_TEST=1
            exec sh "$GITHUB_WORKSPACE/scripts/with-linux-test-keyring.sh" bash "$0"
          fi
          cargo test --locked desktop_session_round_trip_uses_native_store -- --nocapture
      - name: Verify profile registry excludes secrets
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ] && [ "${ANET_LINUX_KEYRING_ACTIVE:-}" != "1" ]; then
            export ANET_LINUX_KEYRING_ACTIVE=1 ANET_ISOLATED_KEYRING_TEST=1
            exec sh "$GITHUB_WORKSPACE/scripts/with-linux-test-keyring.sh" bash "$0"
          fi
          cargo test --locked profile_registry_metadata_never_serializes_secrets -- --nocapture
          cargo test --locked corrupt_profile_registry_is_quarantined_without_data_loss -- --nocapture
          cargo test --locked revoked_profile_marker_is_isolated -- --nocapture
          cargo test --locked local_credentials:: -- --nocapture
          cargo test --locked local_daemon:: -- --nocapture

      - name: Decode App Store Connect key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/apple-api-key"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$key_dir/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      # One draft release receives the macOS, Windows, and Linux bundles, their
      # updater signatures, and latest.json. Publishing the draft makes it
      # visible to installed clients. Linux signs ANet_<version>_amd64.deb;
      # tauri-action merges linux-x86_64 and linux-x86_64-deb into latest.json.
      #
      # 🔴 `releaseBody` is USER-FACING, not a note to ourselves: tauri-action
      # copies it verbatim into latest.json `notes`, and the in-app updater
      # renders those notes in the update prompt. Release *discipline* (audit
      # the draft, publish only after the smoke gates pass, sync the manifest
      # afterwards) belongs in docs/desktop-release-sop.md — never in a string
      # that ships to users. src/release-notes-hygiene.test.ts enforces this.
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        if: inputs.publish == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: "${{ runner.os == 'macOS' && 'Developer ID Application: wenxing hu (446BLT75JZ)' || '' }}"
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: ANet Desktop v__VERSION__
          releaseBody: |-
            Signed and notarized update for macOS (Apple Silicon), and signed update for Windows (x64). Ubuntu 24.04 (amd64) is included only when its installer is listed in this release.

            What's new in 0.2.256:
            - 优化任务列表悬停：鼠标移入或移出只刷新对应行，减少大列表交互卡顿。
            - 任务内容未变化时，后台刷新保留当前列表，避免重复重绘列表和侧栏；有变化的权限、评论和子任务进度仍正常更新。
            - 保留每页 50 条分页、搜索、筛选、详情与编辑。

            What's new in 0.2.255:
            - 任务列表新增每页 50 条分页、上一页/下一页和范围提示；桌面和手机不再一次渲染所有任务行。
            - 排序、筛选和搜索后再分页，条件变化回到第一页；详情和编辑仍对应原任务，已明确选择的任务不会被翻页扩选。
            - 保留统计、看板与已有搜索加载更多；本版改善列表渲染，不会自动重启节点，也不改变服务端列表读取上限。

            What's new in 0.2.254:
            - 独立节点的“密钥”页前置检查已知旧 runtime，直接显示当前版本及所需 2.5.0-preview.137，避免填写后才发现保存不可用。
            - 修复 Hub 通过 SSE 返回升级或权限提示时被误显示为“尚未确认保存”；未知响应仍需刷新确认，不会误报保存成功。
            - 无需绑定 Daemon；此更新不会自动升级或重启节点，也不会切换账号、Provider 或模型。桌面本机安装继续配套 CLI .172 / runtime .138。

            What's new in 0.2.253:
            - 桌面本机 Daemon 的安装与升级入口配套 CLI 2.3.0-preview.172 / runtime 2.5.0-preview.138，包含 OpenCode V1 会话恢复与升级支持。
            - CLI 下载继续支持经摘要校验的独立下载地址；保留停止旧进程、私有安装目录和安装后版本确认。
            - 需手动点击本机安装或升级；不会自动升级远端节点，也不会切换账号、Provider 或模型。已有 OpenCode V1 节点首次升级需按文档保留原会话。

            What's new in 0.2.252:
            - Agent 会话列表新增“进行中”筛选，桌面和手机都能集中查看正在执行任务的 Agent。
            - 执行状态随 Hub 状态刷新，任务结束后自动移出；保留搜索、置顶和分组，可随时返回“全部”。
            - 此更新只调整客户端列表，不会升级、重启远端节点或切换账号、Provider 和模型。

            What's new in 0.2.251:
            - 未绑定 Daemon 的节点也可在“密钥”页面保存、修改和删除自己的环境密钥；无需绑定 Daemon，也不会替换节点身份令牌。
            - 保存结果由目标节点确认，密钥不回显，后续完整启动时供运行时使用；当前会话不会自动重启。已绑定节点仍保留 Daemon 默认继承。
            - 独立节点密钥需要 Hub 0.9.0-preview.128 和目标节点 runtime 2.5.0-preview.137；桌面配套 CLI 为 2.3.0-preview.171。更新客户端不会自动升级远端节点。

            What's new in 0.2.250:
            - OpenCode 创建页明确区分 V1 兼容后台模式与 V2 实验性 TUI 共存，确认页同步展示代际与模式，避免把后台节点误认为已打开 TUI。
            - 修复节点启停确认按钮的文字对比度，确认和返回更易辨认；删除确认保留独立警示。
            - V2 仍需要目标机器已有的 Provider/模型配置和明确工具授权；此更新不会自动切换账号、模型或重启节点。

            What's new in 0.2.249:
            - Daemon 和节点的环境密钥改为真实保存；节点继承 Daemon 默认值，也可单独覆盖。显示来源与保存回执，不回显密钥；下次完整启动时生效。
            - 创建 Codex TUI 共存节点时，可选择目标机器已绑定的 API-key Provider，读取其配置与模型后继续创建，不再被“发现/扫描”入口挡住。
            - 修复当前账号验证成功后仍残留“需要重新登录”红字：重新核实有效凭据后刷新状态，真正失效的账号仍提示登录。
            - Hub / Daemon Provider 推荐 HTTPS，但允许明确配置 HTTP，并显示明文传输风险提示；保存、下发和切换仍需用户操作。
            - 环境密钥与 HTTP 完整链路需要 Hub 0.9.0-preview.127、CLI 2.3.0-preview.170 / runtime 2.5.0-preview.136 配套升级；只更新客户端不会升级远端服务器或重启节点。

            What's new in 0.2.248:
            - 手机 Hub 页把管理入口放到标题下方，Provider 不再被长机器列表埋在页面底部。
            - 点击 Hub Provider 打开已有管理页，可返回 Hub；仅调整入口位置，不会自动保存、下发或切换节点配置。

            What's new in 0.2.247:
            - Hub Provider 下发前展示 Provider、配置版本、模型列表和所选 Daemon 的名称与标识，方便确认目标。
            - 可返回修改选择；取消确认或变更目标不会下发配置。下发仍需明确确认，不会自动切换或重启已有节点。

            What's new in 0.2.246:
            - 节点和 Daemon 的 Provider 页面在确认应用成功后自动刷新当前配置，无需手动刷新才能继续选择。
            - 连续切换 Provider 或模型时使用最新回读配置；每次切换仍需明确确认，未确认生效的结果不会自动重试。

            What's new in 0.2.245:
            - macOS / Windows 的 Daemon 管理可打开独立窗口，调整窗口大小，同时保留主窗口对话；重复打开同一个 Daemon 会回到已有窗口。
            - 独立窗口沿用所选 Hub、网络和 Daemon，Provider、已有 Codex、托管节点与日志在同一处管理；关闭窗口不会停止 Daemon 或切换账号。
            - Android 和网页继续使用原有页面，不新增独立窗口，也不会自动更换节点的 Provider、账号或模型。

            What's new in 0.2.244:
            - Windows 安装器和卸载界面使用 ANet Logo，安装页头与侧栏统一品牌展示，不再显示默认安装图标。
            - 保留原安装目录、升级识别与账号数据；Provider 配置和已有节点不会因本次外观更新自动切换。

            What's new in 0.2.243:
            - Hub Provider 可选择已保存在 Hub 密钥库中的 API 密钥名称，无需再次输入或读取密钥明文；也可输入新的 API 密钥。
            - 配置回读显示引用名称；下发到所选 Daemon 和应用到节点仍需明确确认，不会自动切换已有节点或覆盖共享密钥。
            - 已存密钥引用需要 Hub 0.9.0-preview.125、CLI 2.3.0-preview.166、runtime 2.5.0-preview.132；旧 Hub 会显示具体升级版本。

            What's new in 0.2.242:
            - 首次打开和登录页面也可检查客户端更新，无需先填写 Hub、用户名或密码；使用原有更新提示与安装流程。
            - Hub 令牌页接入真实共享 API 密钥库，支持查看名称、添加和替换；密钥加密保存在 Hub，提交后清空，不回显明文。
            - 密钥保存需当前网络所有者权限，失败可刷新重试；不会自动下发、替换节点身份令牌或切换已有节点。Provider 对已存密钥名称的引用复用仍在接入。

            What's new in 0.2.241:
            - 修复改密码后重新登录又被旧请求踢回登录页，以及账号仍显示需要重新登录的状态竞争；真正失效的新凭据仍会要求验证。
            - Hub Provider 可配置并明确绑定到所选 Daemon；首个应用链路支持 Codex Responses/API-key，不会自动给所有节点复制账号或凭据。
            - 创建 Codex TUI 共存节点可选择 Daemon 已管理的 Provider、认证方式和模型；确认页可返回修改节点名字，保留已选配置。
            - 扫描到的已有 Codex 配置可以明确收录到 Daemon；发现、收录、应用与供应商实际模型权限分别显示。
            - 新 Provider 创建/绑定核心需要 Hub 0.9.0-preview.124、CLI 2.3.0-preview.166、runtime 2.5.0-preview.132；升级客户端不能代替升级管理端软件。

            What's new in 0.2.240:
            - Codex TUI 共存节点详情新增 Daemon Provider、认证方式与模型选择；聊天中的节点信息也可直接操作，不必返回 Daemon 设置。
            - 选择仅针对当前节点，确认后才应用；未绑定 Daemon 时显示管理引导，不会自动收编。列表只展示该 Daemon 已管理的配置，扫描到的配置不会自动收录。
            - 配置与实际模型权限分开显示；真实账号登录和模型调用仍取决于供应商，选择或保存不等于调用成功。

            What's new in 0.2.239:
            - Daemon Provider 页可只读发现工作区及已登记子工作区中已有的 Codex，展示模型、Provider、认证方式和扫描时间；不复制账号、不导入配置、不自动重启。
            - 未绑定的 Codex 使用独立区域展示，不会误出现在 Provider 切换目标中。旧目录布局也可读取状态，无法读取时明确提示，不再误显示为没有 Codex。
            - 本机发现需要 Hub 0.9.0-preview.123、CLI 2.3.0-preview.165、runtime 2.5.0-preview.131；缺少能力时显示具体升级版本和顺序。登录文件存在不代表账号或模型调用仍可用。
            - 任务侧栏标签按当前显示的任务数量降序排列；同数量按名称排序，已选的零任务标签仍可取消筛选。
            - 进入 Daemon 管理时收起无关的 Agent/人员/消息列表，保留 Daemon 设置导航；返回 Agents 时恢复列表。

            What's new in 0.2.238:
            - Daemon Provider 页新增托管 ChatGPT 账号登录与账号列表；登录需由本人在官方页面完成。可明确选择账号和模型，确认后只重启所选 Codex TUI 共存节点并保留会话。
            - 账号登录与 API-key Provider 分开管理；新登录能力需要 Hub 0.9.0-preview.122、CLI 2.3.0-preview.164、runtime 2.5.0-preview.130，旧版本显示明确升级目标。
            - 已有 Codex 状态拆分为清晰卡片；修复设置头像区深色说明文字、输入框和主次按钮配色。
            - 节点详情和 Daemon 节点列表新增「复制节点」入口，可选择是否复制会话；提交后显示待创建状态，旧 Hub 缺少能力时明确提示，不冒称创建成功。
            - 本地核心链路已验证；真实 OAuth 登录及模型权限由账户服务端决定，配置保存不等于远端模型可用。

            What's new in 0.2.237:
            - Provider 页面显示所选 Daemon 的实际 runtime 版本；遇到接口缺失或回读异常时，列出明确的 Hub、CLI、runtime 已验证升级目标和处理步骤。
            - 超时、离线与接口缺失分别提示，不再把超时等同版本过旧；较新版本无需降级。修正 API-key 节点应用已支持的说明，ChatGPT 账号切换仍在开发中。

            What's new in 0.2.236:
            - 本机 Daemon 安装遇到 npm 版本暂不可下载时，改用同版本的 GitHub 正式包，校验固定 SHA256 后再安装，避免一直卡在 npm 重试。
            - 延续 Daemon Provider 管理与已有 Codex 状态展示；ChatGPT 登录账号切换仍在开发中，本版不宣称支持。

            What's new in 0.2.235:
            - Daemon 的 Provider 页接入实际配置，展示已有 Codex 节点状态，支持管理 API-key Provider 和模型。
            - 可将所选 Provider 和模型应用到一个已有 Codex TUI 共存节点；确认后重启该节点、保留原会话，并展示本次应用结果。
            - 本版 API-key 路径使用 Responses 兼容接口，配置成功不代表供应商端点可用；ChatGPT 登录账号切换暂不支持。远程 Hub 与 Daemon 需要升级后使用。

            What's new in 0.2.233:
            - 修复创建节点时的模型目录范围：只展示所选 Daemon 已上报的 Provider 和模型，不再把网络级目录当成本机可用模型。
            - 切换到尚未上报目录的 Daemon 时保留升级提示，避免沿用其他机器的模型列表。

            What's new in 0.2.232:
            - Codex 节点可编辑思考程度与自动执行权限，配置经 Hub 下发到节点。
