name: Mac idle task performance
on:
  pull_request:
    paths: ['src/board-sync*', 'src/task-board-store*', 'tests/task-list-performance/**', '.github/workflows/mac-idle-performance.yml']
  push:
    branches: [main]
    paths: ['src/board-sync*', 'src/task-board-store*', 'tests/task-list-performance/**', '.github/workflows/mac-idle-performance.yml']
permissions:
  contents: read
jobs:
  idle-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: candidate
      - name: Actual table and sync regression in isolated Docker
        run: |
          docker build -f candidate/tests/task-list-performance/Dockerfile -t mac-idle candidate
          docker run --rm --network none mac-idle
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b1ddd6d218fb97fc0737d2d3462dd7669245443f
          path: baseline
      - name: Unchanged baseline must expose idle redraw
        run: |
          cp candidate/tests/task-list-performance/table.test.tsx baseline/tests/task-list-performance/table.test.tsx
          docker build -f baseline/tests/task-list-performance/Dockerfile -t mac-idle-baseline baseline
          set +e
          docker run --rm --network none mac-idle-baseline bun test table.test.tsx --test-name-pattern 'idle poll' > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -ne 0
          grep -q 'idle poll' baseline.log
          grep -q 'idle poll measured row renders: 1800' baseline.log
