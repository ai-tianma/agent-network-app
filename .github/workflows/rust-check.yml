# PR 期**从来没编译过 Rust** —— 门只有 unit-tests(JS/TS)和 scrub。
#
# 🔴 2026-09-25 的代价:#351 改 src-tauri/src/tray.rs,PR 上 unit-tests + scrub
#    全绿合并;0.2.92 发版时 Mac/Windows 的 release 在 `cargo test` 双双失败
#    (tray.rs:413 E0369 —— TrayItem 没实现 PartialEq),靠 #353 补救。
#    **编译错误被留到最贵、最晚的那一刻才发现**,而那正是没人愿意重跑一轮的时候。
#
# 这道门把同一个判据前移到 PR 期:改动碰了 src-tauri/** 才跑,`cargo check` +
# `cargo test` 全量过一遍。
#
# 🔴 Linux 不是发布平台(打的是 Mac/Windows),所以这道门**不声称覆盖平台差异**:
#    tray 里 `#[cfg(target_os = "macos")]` 的分支、Windows 的 keyring,仍然只有
#    desktop-tauri 的 push:main 打包才验得到。但 #351 那类错(derive/trait 缺失、
#    测试目标编不过)与平台无关,Linux 上一样红 —— 挡住它正是这里的目的。
#
# 下面三样是「编译期就要、但不入库」的输入,和 desktop-tauri 打包前的准备同源:
#   * src-tauri/icons/ —— generate_context! 编译期读图标,目录在 .gitignore 里;
#   * dist/            —— frontendDist,同样不入库;
#   * binaries/commhub —— externalBin 资源,tauri-build 会校验它存在。
#   缺任何一个,`cargo` 连编译都进不去,和这次要挡的那类错混在一起。
name: rust check

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      # 门自己被改时也要跑 —— 否则「把这道门改坏」永远不会被这道门发现。
      - '.github/workflows/rust-check.yml'
      - 'scripts/with-linux-test-keyring.sh'
      - 'tests/linux-credential-store/**'
      - 'tests/local-daemon-packages/**'

permissions:
  contents: read

jobs:
  local-daemon-packages:
    name: Private daemon package pair (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target policy -t anet-daemon-packages:test -f tests/local-daemon-packages/Dockerfile .
      - run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-daemon-packages:test
      - run: docker build --target private-prefix -t anet-daemon-prefix:test -f tests/local-daemon-packages/Dockerfile .
      - run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-daemon-prefix:test

  rust-check:
    name: rust-check (ubuntu-latest)
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    timeout-minutes: 30
    steps:
      - name: Prepare isolated build container
        run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates sudo unzip
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上编译要 webkit2gtk/gtk/appindicator 这一套。仓里没有先例
      # (desktop-tauri 只跑 macos/windows),所以按 Tauri v2 官方 Linux 前置依赖装;
      # 其中 libdbus-1 来自 tao -> dbus,libssl 来自 reqwest 的 native-tls。
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            dbus \
            gnome-keyring \
            libsecret-tools

      # toolchain 显式写出来:下面的 SHA 是 stable 分支的 commit,action.yml 的
      # 默认值也确实是 stable,但钉 SHA 之后「这条 ref 叫什么」不再有意义,
      # 默认值是别人的实现细节,不该由我们赌。
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      # npm ci 而不是 npm install:同一个 commit 在不同时间必须装出同一份依赖图。
      - run: npm ci

      # icons 不入库,`npx tauri icon` 从 assets/icon.png 重新生成 —— desktop-tauri
      # 用的同一条命令。这一步靠上面的 npm ci 提供 @tauri-apps/cli。
      - name: Generate icons (src-tauri/icons/ is gitignored)
        run: npx tauri icon assets/icon.png

      # frontendDist 只需要**路径存在**:这道门验的是 Rust 编译,不是前端产物。
      # desktop-tauri 是用 `npx expo export -p web` 产 dist 的,那要多花一分钟,
      # 换来的信息这里一行都用不上。
      - name: Create frontendDist placeholder (contents belong to desktop-tauri)
        run: mkdir -p dist

      # externalBin 同样不入库,照 desktop-tauri 的写法把 sidecar 真的编出来,
      # 不放占位文件 —— 资源缺失在编译期和「Rust 写错了」长得一样,不该靠猜。
      - name: Build pinned local CommHub sidecar
        run: |
          npm ci --prefix local-hub-sidecar --ignore-scripts
          npm run build:local-hub-sidecar

      # 🔴 先 check 再 test:#351 那个 E0369 长在 `#[cfg(test)]` 里,`cargo check`
      #    看不见它 —— 真正挡住 #351 复发的是下面这步。两步都留着:check 对
      #    非测试代码报错更快,test 才是那道门的全部。
      - name: cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: cargo test
        env:
          ANET_ISOLATED_KEYRING_TEST: '1'
        run: sh scripts/with-linux-test-keyring.sh cargo test --locked --manifest-path src-tauri/Cargo.toml

  linux-credential-store:
    name: Linux credential persistence (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build locked dependency probe
        run: docker build --target probe -t anet-linux-credential:test -f tests/linux-credential-store/Dockerfile .
      - name: Real Secret Service persistence and failure modes
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges anet-linux-credential:test
