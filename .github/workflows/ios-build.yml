# iOS signed .ipa build + TestFlight upload (Vincent: ship iOS to TestFlight
# without an Expo/EAS account — raw xcodebuild + Apple toolchain on a mac runner).
#
# ios/ is NOT committed (Expo CNG), so we `expo prebuild -p ios` in CI to
# generate the Xcode project, then archive + export an App Store .ipa and push
# it to TestFlight using an App Store Connect API key (.p8) for ALL auth —
# code signing AND upload. No Apple ID / app-specific password, no EAS.
#
# ── How signing works here ──────────────────────────────────────────────────
# A protected team App Store Connect API key creates an ephemeral Apple
# Distribution certificate and IOS_APP_STORE profile. The runner imports the
# matching private key into a temporary keychain, signs manually, then revokes
# and deletes all temporary signing assets in an always-run cleanup step. This
# avoids both registered development devices and long-lived iOS P12 secrets.
#
# ── Assumptions (see report) ────────────────────────────────────────────────
#  * An App Store Connect app record for bundle id `top.vansin.agentnetwork`
#    already exists under team 446BLT75JZ. Auto-provisioning can create certs
#    & profiles but NOT the app record — create it once in App Store Connect.
#  * The ASC API key has the "App Manager" role (needed to manage signing
#    assets and to upload builds to TestFlight).
#  * macOS runners are billed at 10x Linux minutes — this is manual-trigger only.

name: ios-build

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact commit on main to build (40-char sha). Empty = the main HEAD at dispatch."
        required: false
        default: ""
        type: string
      upload_testflight:
        description: "Upload the built .ipa to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios-ipa:
    # 2026-10-21(发版速度分析):有一例 ios-build 跑了 **61.7 小时**后被 cancelled,
    # 另一次合法构建用了 193 分钟。所以上限取 4 小时:能容下最慢的那次真构建,
    # 又不会让一个卡死的构建占着 macOS runner 挂两天半。
    timeout-minutes: 240
    # Reuse the reviewed signing environment used by desktop notarization.
    # It already owns the App Store Connect API key; keeping one credential
    # namespace avoids stale duplicate ASC_* repository secrets.
    environment: macos-signing
    # macos-14 == Apple silicon, recent Xcode. Pin rather than macos-latest so
    # an Xcode bump can't silently break signing/export.
    # macos-14 ships Xcode 15.4; React Native requires >= 16.1
    # ("[!] Invalid `Podfile` file: Please upgrade XCode." at pod install).
    # macos-15 ships Xcode 16.x.
    runs-on: macos-15

    env:
      # Expo SDK 56's ExpoModulesJSI Swift package declares tools-version 6.2.
      # macos-15 still defaults to Xcode 16.4 / Swift 6.1, so select the
      # runner image's pinned Xcode 26.2 explicitly.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      # Bundle id / team are also read by Expo from app.json + this team id.
      APPLE_TEAM_ID: "446BLT75JZ"
      BUNDLE_ID: "top.vansin.agentnetwork"
      # Avoid the precompiled React Native framework ABI mismatch previously
      # observed in archive builds. Build native modules from this checkout.
      EXPO_USE_PRECOMPILED_MODULES: "false"
      # App Store Connect rejects a reused CFBundleVersion. The repository run
      # number is numeric and monotonically increases across manual builds.
      IOS_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      # Same exact-commit gate as release-desktop-auto-update.yml. macos-signing
      # only admits ref main, so a release built "last" (after Android and
      # desktop) would otherwise pick up whatever merged since. Pass the release
      # sha to build exactly it; empty keeps the old behaviour (main HEAD).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Require exact merged commit
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_COMMIT:-$GITHUB_SHA}"
          resolved="$(git rev-parse HEAD)"
          # Separate tests. A combined `[[ =~ && == ]]` succeeds on macOS bash 3.2.
          [[ "$requested" =~ ^[0-9a-f]{40}$ ]]
          [[ "$resolved" == "$requested" ]]
          # Full history from checkout; do not re-shallow main (the sha may
          # legitimately precede the current tip).
          git fetch origin main
          git merge-base --is-ancestor "$resolved" origin/main
          echo "building $resolved"

      - name: Require Xcode 26.2 and Swift 6.2
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          swiftc --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -E 'Apple Swift version 6\.2([ .]|$)' "$RUNNER_TEMP/swift-version.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Generate ios/ from app.json (Expo CNG). --no-install: we already ran
      # `npm ci`; pods are installed explicitly in the next step for clarity.
      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --no-install

      # app.json pins `expo.ios.buildNumber: "1"`, so prebuild writes a literal
      # 1 into the generated Info.plist. Passing CURRENT_PROJECT_VERSION to
      # xcodebuild does not change that: the generated plist stores a literal,
      # not $(CURRENT_PROJECT_VERSION), so the setting has nothing to expand
      # into. INFOPLIST_KEY_CFBundleVersion would be no better — those settings
      # only apply when Xcode generates the plist (GENERATE_INFOPLIST_FILE=YES),
      # and Expo ships a real INFOPLIST_FILE. Both are silent no-ops, which is
      # how every build so far shipped CFBundleVersion=1 while the run number
      # showed up only in the artifact name.
      #
      # Write the value into the plist prebuild just produced, then assert the
      # archive's real value further down — the assertion is what makes this
      # trustworthy, whatever the mechanism.
      - name: Inject CFBundleVersion from the run number
        run: |
          set -euo pipefail
          # The run number is the only source of build numbers here, but write
          # that assumption down as a gate instead of trusting it. App Store
          # Connect takes CFBundleVersion as an increasing numeric string; an
          # empty or non-numeric value sails through PlistBuddy and only fails
          # at upload, far from the cause.
          case "$IOS_BUILD_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::IOS_BUILD_NUMBER must be a positive integer, got '$IOS_BUILD_NUMBER'"
              exit 1
              ;;
          esac
          if [ "$IOS_BUILD_NUMBER" -le 0 ]; then
            echo "::error::IOS_BUILD_NUMBER must be greater than zero, got '$IOS_BUILD_NUMBER'"
            exit 1
          fi

          # Collect every candidate rather than taking the first match. Two
          # plists would mean the Expo layout changed, and silently picking one
          # is how a build ships the wrong bundle's version.
          #
          # Written for Bash 3.2: macOS ships that as /bin/bash, and mapfile /
          # readarray are Bash 4 builtins. On a 3.2 shell those fail as
          # "command not found" — after prebuild and pod install have already
          # run, which is an expensive place to discover a portability bug.
          # A file of candidates plus wc/sed needs no array support and keeps
          # spaces in paths intact (find emits one newline-terminated path per
          # line; a newline inside a filename is out of scope here).
          CANDIDATES="$RUNNER_TEMP/ios-info-plists.txt"
          find ios -maxdepth 2 -name Info.plist -not -path '*/Pods/*' | LC_ALL=C sort > "$CANDIDATES"
          count=$(wc -l < "$CANDIDATES" | tr -d '[:space:]')
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 generated ios Info.plist outside Pods, found $count"
            # Only enumerate when there is something to enumerate: at zero the
            # loop would print nothing useful, and the count line above already
            # says what happened.
            if [ "$count" -gt 0 ]; then
              while IFS= read -r candidate; do
                echo "::error::candidate: $candidate"
              done < "$CANDIDATES"
            fi
            exit 1
          fi
          PLIST=$(sed -n '1p' "$CANDIDATES")

          # Set, never Add: app.json must already provide expo.ios.buildNumber
          # so prebuild emits the key. If the key is missing, PlistBuddy fails
          # here and that is the correct outcome — Add would paper over a
          # config change that should be visible.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" "$PLIST"

          written=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          if [ "$written" != "$IOS_BUILD_NUMBER" ]; then
            echo "::error::CFBundleVersion is $written after injection, expected $IOS_BUILD_NUMBER"
            exit 1
          fi
          echo "CFBundleVersion=$written in $PLIST"

      - name: CocoaPods install
        run: |
          set -euo pipefail
          cd ios
          pod install

      # Resolve the actual scheme name & workspace path Expo generated, instead
      # of hard-coding (Expo derives them from app.json "name": "Agent Network").
      - name: Resolve Xcode workspace & scheme
        id: xc
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No .xcworkspace under ios/ — pod install should have created it; check the CocoaPods step above"; exit 1
          fi
          # First shared scheme; Expo names it after the project (e.g. "AgentNetwork").
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"
          echo "Resolved workspace=$WORKSPACE scheme=$SCHEME"

      # Drop the base64 App Store Connect API key where xcodebuild/altool
      # auto-find it. The same reviewed environment secret is used by desktop
      # notarization, so iOS cannot silently drift onto a stale duplicate key.
      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # sanity: must be a valid PEM private key now
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH" || { echo "::error::APPLE_API_KEY_BASE64 did not decode to a PEM .p8"; exit 1; }
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare ephemeral App Store distribution signing
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          # 只读:拉本仓 ios-build 的 run 历史,用 run 时间窗认出「本流程造的」分发证书(见 scripts/ios-signing-cert-policy.mjs)
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ios-distribution-signing.mjs prepare

      # Archive with the exact ephemeral App Store profile. Automatic archive
      # signing asks for a Development profile (and therefore a registered
      # device), so release CI intentionally uses manual distribution signing.
      # 归档重试一次。发版速度分析(2026-10-21):iOS 构建中位 10.8 分钟,但
      # max 193.1 分钟,历史还有一次跑了 61.7 小时才被 cancelled;而
      # `ios TestFlight status` 15 次全是**人工** dispatch —— 失败之后没有人再跑一次,
      # 「发完了没有」因此没有自动终点。xcodebuild 的失败多数是环境抖动(钥匙串、
      # 证书),重跑一次就过;这里只重试一次,避免把 runner 队列灌满。
      - name: Archive (xcodebuild)
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          archive_once() {
            xcodebuild \
              -workspace "${{ steps.xc.outputs.workspace }}" \
              -scheme "${{ steps.xc.outputs.scheme }}" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/AgentNetwork.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
              OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain_path }}" \
              CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
              clean archive
          }
          if ! archive_once; then
            echo "archive failed once; retrying once (xcodebuild is usually flaky on keychain/certs)"
            rm -rf "$RUNNER_TEMP/AgentNetwork.xcarchive"
            sleep 10
            archive_once
          fi

      # Fail before export if Xcode silently falls back to a Development
      # identity/profile. App Store profiles contain no device allow-list and
      # do not grant get-task-allow.
      - name: Verify archive uses App Store distribution signing
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/AgentNetwork.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$APP" ] || { echo "::error::Archive contains no application"; exit 1; }
          codesign --verify --deep --strict "$APP"
          codesign -d --verbose=4 "$APP" 2> "$RUNNER_TEMP/archive-codesign.txt"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/archive-codesign.txt"
          # Fail closed on the build number too. Injection happens ten steps
          # earlier, and a pod install or a plist regeneration in between could
          # undo it without any error — the only value that matters is the one
          # actually inside the archived app.
          archived_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          if [ "$archived_build" != "$IOS_BUILD_NUMBER" ]; then
            echo "::error::Archived CFBundleVersion is $archived_build, expected $IOS_BUILD_NUMBER — App Store Connect rejects a reused build number"
            exit 1
          fi
          echo "Archived CFBundleVersion=$archived_build"

          signing_identity=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:SigningIdentity' "$RUNNER_TEMP/AgentNetwork.xcarchive/Info.plist")
          case "$signing_identity" in
            "Apple Distribution:"*|"iPhone Distribution:"*) ;;
            *) echo "::error::Archive signing identity is not Apple Distribution"; exit 1 ;;
          esac

          PROFILE="$APP/embedded.mobileprovision"
          [ -f "$PROFILE" ] || { echo "::error::Archive has no embedded provisioning profile"; exit 1; }
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/archive-profile.plist"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/archive-profile.plist" >/dev/null 2>&1; then
            echo "::error::Archive profile contains registered devices; expected App Store distribution"
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/archive-profile.plist")" = "false"
          application_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/archive-profile.plist")
          test "$application_id" = "$APPLE_TEAM_ID.$BUNDLE_ID"

      # Export the archive to an App Store .ipa using the committed ExportOptions.
      - name: Export .ipa
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          cp ios-ci/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Set :signingStyle manual' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string ${{ steps.signing.outputs.profile_name }}" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AgentNetwork.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::No .ipa produced"; exit 1; }
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      # Upload the .ipa as an artifact FIRST so it is downloadable even if the
      # TestFlight upload below fails.
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-network-ios-ipa-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      # Push to TestFlight with the same ASC API key. altool reads the key from
      # ~/.appstoreconnect/private_keys/AuthKey_<id>.p8 by id+issuer.
      - name: Upload to TestFlight (altool)
        if: ${{ inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          # App Store validation is asynchronous. Revoking this certificate as
          # soon as altool returns turns the accepted upload into ITMS-90035.
          echo 'IOS_RETAIN_REMOTE_SIGNING_ASSETS=true' >> "$GITHUB_ENV"

      # An older exact release checkout may predate the distribution helper.
      # Load the automation from this workflow's main SHA without changing the IPA source.
      - name: Checkout internal distribution automation
        if: ${{ inputs.upload_testflight }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ios-distribution-tools
          sparse-checkout: scripts/ios-distribute-internal.mjs
          sparse-checkout-cone-mode: false

      - name: Distribute uploaded build to all internal TestFlight groups
        if: ${{ inputs.upload_testflight }}
        timeout-minutes: 16
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: node ios-distribution-tools/scripts/ios-distribute-internal.mjs "$IOS_BUILD_NUMBER"

      - name: Remove local signing material; revoke remote assets only after an unsuccessful upload
        if: ${{ always() }}
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/ios-distribution-signing.mjs cleanup
