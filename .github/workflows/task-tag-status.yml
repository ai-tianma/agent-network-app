name: Task tag status core
on:
  pull_request:
    paths:
      - 'src/TaskDashboard.tsx'
      - 'src/TaskTagStatusChart.tsx'
      - 'src/task-tag-status*'
      - 'src/i18n-tag-status.ts'
      - 'src/requirements-hub.ts'
      - 'src/RequirementBoard.tsx'
      - 'src/task-board-model.ts'
      - 'src/TaskTags.tsx'
      - 'src/TaskFilterSidebar.tsx'
      - 'tests/task-tag-status/**'
      - '.github/workflows/task-tag-status.yml'
permissions:
  contents: read
jobs:
  tag-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Model, existing dashboard and typecheck first
        run: |
          docker build --target core -f tests/task-tag-status/Dockerfile -t tag-status-core .
          docker run --rm --network none tag-status-core
      - name: Actual exported desktop and phone UI
        run: |
          mkdir -p "$RUNNER_TEMP/tag-status-ui"
          docker build --target browser -f tests/task-tag-status/Dockerfile -t tag-status-ui .
          docker run --rm --network none -v "$RUNNER_TEMP/tag-status-ui:/output" tag-status-ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: TEST-ONLY-task-tag-status-ui
          path: ${{ runner.temp }}/tag-status-ui
