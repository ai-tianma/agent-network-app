name: ios TestFlight status

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: CFBundleVersion to inspect
        required: true
        default: "15"
      enable_public_testing:
        description: Declare exempt encryption, attach the build to the public group, and submit it for Beta Review
        required: true
        type: boolean
        default: false
      set_export_compliance_only:
        description: Declare exempt encryption (usesNonExemptEncryption=false) for this build so internal testers can install it. Does NOT touch groups or Beta Review.
        required: false
        type: boolean
        default: false
      list_beta_groups:
        description: Print every beta group's name, isInternalGroup, hasAccessToAllBuilds, publicLinkEnabled and whether it holds this build (no tester emails)
        required: false
        type: boolean
        default: false
      include_app_store_versions:
        description: Read App Store version/review states and linked build numbers; never submits or changes a version
        required: false
        type: boolean
        default: false
      attach_app_store_version:
        description: "Re-point this App Store version (version string, e.g. 1.0) at the inspected build. It does NOT submit for review, and it refuses a build that is not VALID / not expired / not APP_STORE_ELIGIBLE."
        required: false
        type: string
        default: ""
      cancel_superseded_beta_reviews:
        description: "Withdraw the pending Beta App Review submissions of every build OLDER than this build number, so Apple's submission limit frees a slot for the current one. Refuses a build number this app does not have."
        required: false
        type: string
        default: ""
      distribute_to_groups:
        description: Comma-separated beta group names (or all-internal) to attach this build to once it is VALID. Empty = no change.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  inspect-testflight:
    runs-on: ubuntu-latest
    environment: macos-signing
    steps:
      - name: Checkout internal distribution automation
        if: ${{ inputs.distribute_to_groups == 'all-internal' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ios-distribution-tools
          sparse-checkout: scripts/ios-distribute-internal.mjs
          sparse-checkout-cone-mode: false
      - name: Query App Store Connect without exposing credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          ENABLE_PUBLIC_TESTING: ${{ inputs.enable_public_testing }}
          SET_EXPORT_COMPLIANCE_ONLY: ${{ inputs.set_export_compliance_only }}
          LIST_BETA_GROUPS: ${{ inputs.list_beta_groups }}
          INCLUDE_APP_STORE_VERSIONS: ${{ inputs.include_app_store_versions }}
          ATTACH_APP_STORE_VERSION: ${{ inputs.attach_app_store_version }}
          CANCEL_SUPERSEDED_BETA_REVIEWS: ${{ inputs.cancel_superseded_beta_reviews }}
          DISTRIBUTE_TO_GROUPS: ${{ inputs.distribute_to_groups }}
          BUNDLE_ID: top.vansin.agentnetwork
          PUBLIC_LINK_ID: ZvqYnCA9
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "::error::build_number must be numeric"; exit 1 ;;
          esac

          jwt_file="$RUNNER_TEMP/app-store-connect.jwt"
          node <<'NODE' > "$jwt_file"
          const crypto = require('node:crypto');
          const b64url = (value) => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: 'ES256', kid: process.env.APPLE_API_KEY, typ: 'JWT' }));
          const payload = b64url(JSON.stringify({
            iss: process.env.APPLE_API_ISSUER,
            // Same claims as scripts/ios-distribution-signing.mjs (used by
            // ios-build): back-date iat a few seconds so runner clock skew
            // can't make Apple see a token issued in the future.
            iat: now - 5,
            exp: now + 900,
            aud: 'appstoreconnect-v1',
          }));
          const unsigned = `${header}.${payload}`;
          const key = Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64').toString('utf8');
          const signature = crypto.sign('sha256', Buffer.from(unsigned), {
            key,
            dsaEncoding: 'ieee-p1363',
          }).toString('base64url');
          process.stdout.write(`${unsigned}.${signature}`);
          NODE
          chmod 600 "$jwt_file"
          jwt=$(<"$jwt_file")

          # On any non-2xx, print the HTTP status, the endpoint path and Apple's
          # errors[] (status/code/title/detail) on stderr, then fail. Never echo
          # request headers or the JWT. Success bodies go to stdout as before.
          asc_fail() {
            local method="$1" endpoint="$2" code="$3" body="$4"
            echo "::error::App Store Connect $method /v1/$endpoint returned HTTP $code" >&2
            jq -r '.errors[]? | "  apple error: status=\(.status // "") code=\(.code // "") title=\(.title // "") detail=\(.detail // "")"' "$body" >&2 2>/dev/null \
              || echo '  (response body was not JSON)' >&2
            rm -f "$body"
            return 1
          }

          asc_get() {
            local endpoint="$1"
            shift
            local body="$RUNNER_TEMP/asc-response.json" code
            code=$(curl --silent --show-error --get --output "$body" --write-out '%{http_code}' \
              -H "Authorization: Bearer $jwt" \
              -H 'Accept: application/json' \
              "https://api.appstoreconnect.apple.com/v1/$endpoint" "$@" || true)
            case "$code" in
              2??) cat "$body"; rm -f "$body" ;;
              *) asc_fail GET "$endpoint" "${code:-000}" "$body" ;;
            esac
          }

          asc_write() {
            local method="$1"
            local endpoint="$2"
            local body="$3"
            local out="$RUNNER_TEMP/asc-response.json" code
            code=$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              --request "$method" \
              -H "Authorization: Bearer $jwt" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$body" \
              "https://api.appstoreconnect.apple.com/v1/$endpoint" || true)
            case "$code" in
              2??) cat "$out"; rm -f "$out" ;;
              *) asc_fail "$method" "$endpoint" "${code:-000}" "$out" ;;
            esac
          }

          app_json="$RUNNER_TEMP/app.json"
          asc_get apps --data-urlencode "filter[bundleId]=$BUNDLE_ID" --data-urlencode 'limit=2' > "$app_json"
          app_id=$(jq -r '.data[0].id // empty' "$app_json")
          if [ -z "$app_id" ]; then
            echo "::error::no App Store Connect app found for $BUNDLE_ID"
            exit 1
          fi

          # ── withdraw the superseded builds' pending Beta App Review submissions ──
          # 🔴 为什么需要：同一天发了好几版，每一版都提交了一次 Beta App Review，
          #    Apple 的提交上限（422 ENTITY_UNPROCESSABLE.SUBMISSION_LIMIT_REACHED）
          #    就把最新那一版挡在外面了 —— 那一版在公开组里，externalBuildState
          #    停在 READY_FOR_BETA_SUBMISSION，外部测试者拿不到，而所有检查都是绿的。
          #    被取代的旧版再占着审核位没有意义（它审的是已经过时的版本）。
          # 护栏：给出的 build 号必须真的存在；只动**更旧**的 build；只撤销还在审的
          #    提交（已批准/已拒绝的不动）；每一次撤销都打印出来。
          if [ -n "$CANCEL_SUPERSEDED_BETA_REVIEWS" ]; then
            keep="$CANCEL_SUPERSEDED_BETA_REVIEWS"
            echo "Cancel pending Beta App Review submissions of builds older than $keep"
            all_builds="$RUNNER_TEMP/app-builds.json"
            asc_get builds --data-urlencode "filter[app]=$app_id" --data-urlencode 'limit=200' > "$all_builds"
            keep_exists=$(jq --arg v "$keep" '[.data[]|select((.attributes.version // "") == $v)]|length' "$all_builds")
            if [ "$keep_exists" = 0 ]; then
              echo "::error::build $keep does not exist for $BUNDLE_ID — refusing to cancel anything"
              exit 1
            fi
            cancelled=0
            while IFS= read -r row; do
              [ -n "$row" ] || continue
              bnum=$(jq -r '.attributes.version' <<<"$row")
              bid=$(jq -r '.id' <<<"$row")
              # 只动更旧的：数字比较用 10# 去掉前导零
              if [ "$((10#$bnum))" -ge "$((10#$keep))" ]; then continue; fi
              subs="$RUNNER_TEMP/subs-$bid.json"
              asc_get betaAppReviewSubmissions --data-urlencode "filter[build]=$bid" --data-urlencode 'limit=10' > "$subs"
              while IFS= read -r sub; do
                [ -n "$sub" ] || continue
                sid=$(jq -r '.id' <<<"$sub")
                state=$(jq -r '.attributes.betaReviewState // "UNKNOWN"' <<<"$sub")
                case "$state" in
                  IN_REVIEW|WAITING_FOR_REVIEW|PENDING)
                    echo "  withdrawing beta review submission $sid of build $bnum (state=$state)"
                    curl --silent --show-error --request DELETE \
                      -H "Authorization: Bearer $jwt" -H 'Accept: application/json' \
                      --output "$RUNNER_TEMP/del.json" --write-out '%{http_code}' \
                      "https://api.appstoreconnect.apple.com/v1/betaAppReviewSubmissions/$sid" > "$RUNNER_TEMP/del.code" || true
                    code=$(cat "$RUNNER_TEMP/del.code")
                    if [ "${code:0:1}" = 2 ]; then
                      cancelled=$((cancelled + 1))
                      echo "  withdrawn: build $bnum submission $sid"
                    else
                      echo "::error::withdrawing submission $sid (build $bnum) returned HTTP $code"
                      jq -r '.errors[]? | "  apple error: status=\(.status // "") code=\(.code // "") title=\(.title // "") detail=\(.detail // "")"' "$RUNNER_TEMP/del.json" >&2 2>/dev/null || true
                      exit 1
                    fi ;;
                  *)
                    echo "  leaving build $bnum submission $sid alone (state=$state)" ;;
                esac
              done < <(jq -c '.data[]?' "$subs")
            done < <(jq -c '.data[]?' "$all_builds")
            echo "withdrew $cancelled pending Beta App Review submission(s) of builds older than $keep"
          fi

          if [ "$INCLUDE_APP_STORE_VERSIONS" = 'true' ]; then
            versions_json="$RUNNER_TEMP/app-store-versions.json"
            asc_get "apps/$app_id/appStoreVersions" \
              --data-urlencode 'filter[platform]=IOS' \
              --data-urlencode 'include=build' \
              --data-urlencode 'limit=200' > "$versions_json"
            echo 'App Store versions (read-only; TestFlight Beta Review is separate):'
            jq --arg appId "$app_id" '{
              appId: $appId,
              complete: (.links.next == null),
              versions: [.data[] | {
                id, version: .attributes.versionString,
                state: .attributes.appStoreState,
                appVersionState: .attributes.appVersionState,
                downloadable: .attributes.downloadable,
                createdDate: .attributes.createdDate,
                buildId: (.relationships.build.data.id // null)
              }],
              builds: [.included[]? | select(.type == "builds") | {
                id, version: .attributes.version,
                processingState: .attributes.processingState,
                expired: .attributes.expired
              }]
            }' "$versions_json"
          fi

          builds_json="$RUNNER_TEMP/builds.json"
          asc_get builds \
            --data-urlencode "filter[app]=$app_id" \
            --data-urlencode "filter[version]=$BUILD_NUMBER" \
            --data-urlencode 'limit=10' > "$builds_json"
          build_id=$(jq -r '.data[0].id // empty' "$builds_json")
          if [ -z "$build_id" ]; then
            echo "::error::build $BUILD_NUMBER was not found"
            exit 1
          fi

          details_json="$RUNNER_TEMP/build-details.json"
          asc_get buildBetaDetails --data-urlencode "filter[build]=$build_id" --data-urlencode 'limit=2' > "$details_json"

          # ── re-point an App Store version at this build ─────────────────────
          # 🔴 为什么需要这一步：版本 1.0 绑的是 **build 3，而那个 build 的二进制已过期**。
          #    绑着过期 build 的版本过不了审核 —— 就算别的问题都修好了也一样。所以
          #    「把版本指向一个有效 build」是任何一次重提审的前置条件。
          # 🔴 这一步**不提交审核**（appStoreVersionSubmissions 一概不碰），也不改版本号、
          #    描述、截图、隐私问卷 —— 那些都要按 Apple 的拒审原信来改，不能猜。
          #    护栏：build 必须 VALID、未过期、且是 APP_STORE_ELIGIBLE；版本不能正在审核中。
          if [ -n "$ATTACH_APP_STORE_VERSION" ]; then
            echo "Attach build $BUILD_NUMBER to App Store version $ATTACH_APP_STORE_VERSION"
            vjson="$RUNNER_TEMP/attach-version.json"
            asc_get "apps/$app_id/appStoreVersions" \
              --data-urlencode 'filter[platform]=IOS' \
              --data-urlencode "filter[versionString]=$ATTACH_APP_STORE_VERSION" \
              --data-urlencode 'include=build' \
              --data-urlencode 'limit=10' > "$vjson"
            vid=$(jq -r '.data[0].id // empty' "$vjson")
            if [ -z "$vid" ]; then
              echo "::error::no App Store version $ATTACH_APP_STORE_VERSION for $BUNDLE_ID"
              exit 1
            fi
            vstate=$(jq -r '.data[0].attributes.appStoreState // "UNKNOWN"' "$vjson")
            vbuild=$(jq -r '.data[0].relationships.build.data.id // "none"' "$vjson")
            echo "  version $vid state=$vstate currently bound to ${vbuild:-none}"
            case "$vstate" in
              WAITING_FOR_REVIEW|IN_REVIEW|WAITING_FOR_RELEASE)
                echo "::error::version $vid is in state $vstate — refusing to change its build while review is pending"
                exit 1 ;;
            esac
            bstate=$(jq -r '.data[0].attributes.processingState // "UNKNOWN"' "$builds_json")
            # 🔴 jq 的 `//` 对 **false 也成立**（它是「取替代值」不是「取默认值」）：
            #    `false // "UNKNOWN"` 会得到 "UNKNOWN"。build 151 的 expired 正是 false,
            #    照直写会把唯一可用的 build 判成「过期」而拒掉。所以显式分支。
            bexpired=$(jq -r 'if (.data[0].attributes.expired == null) then "UNKNOWN" else (.data[0].attributes.expired | tostring) end' "$builds_json")
            bkind=$(jq -r '.data[0].attributes.buildAudienceType // "UNKNOWN"' "$builds_json")
            echo "  build $build_id state=$bstate expired=$bexpired audience=$bkind"
            if [ "$bstate" != 'VALID' ] || [ "$bexpired" != 'false' ] || [ "$bkind" != 'APP_STORE_ELIGIBLE' ]; then
              echo "::error::build $BUILD_NUMBER is not a reviewable App Store build (state=$bstate expired=$bexpired audience=$bkind) — refusing to attach it"
              exit 1
            fi
            if [ "$vbuild" = "$build_id" ]; then
              echo "  already bound to this build — nothing to change"
            else
              vpatch=$(jq -cn --arg vid "$vid" --arg bid "$build_id" '{data:{type:"appStoreVersions",id:$vid,relationships:{build:{data:{type:"builds",id:$bid}}}}}')
              asc_write PATCH "appStoreVersions/$vid" "$vpatch" > /dev/null
              echo "  patched: version $vid now points at build $build_id"
            fi
            asc_get "appStoreVersions/$vid" --data-urlencode 'include=build' > "$vjson"
            # 🔴 带 include 的单资源 GET 回的是 JSON:API **document**（`{data:{…}}`），
            #    而不带 include 时回的是裸资源。两种形状都见过，所以这里两种都认 ——
            #    只认一种的话，回读会打出一片 null，看起来像「改了但没生效」。
            jq '(.data // .) | {id, version: .attributes.versionString, state: .attributes.appStoreState, buildId: (.relationships.build.data.id // null)}' "$vjson"
          fi

          groups_json="$RUNNER_TEMP/groups.json"
          asc_get betaGroups --data-urlencode "filter[app]=$app_id" --data-urlencode 'limit=200' > "$groups_json"

          if [ "$SET_EXPORT_COMPLIANCE_ONLY" = 'true' ] && [ "$ENABLE_PUBLIC_TESTING" = 'true' ]; then
            echo "::error::set_export_compliance_only and enable_public_testing are mutually exclusive"
            exit 1
          fi

          # Compliance-only: the app uses only OS-provided HTTPS/TLS (exempt encryption).
          # Declares that for this build so internal testers can install it; never
          # touches beta groups and never submits for Beta App Review.
          if [ "$SET_EXPORT_COMPLIANCE_ONLY" = 'true' ]; then
            encryption=$(jq -r '
              if (.data[0].attributes.usesNonExemptEncryption | type) == "boolean"
              then (.data[0].attributes.usesNonExemptEncryption | tostring)
              else "unset"
              end
            ' "$builds_json")
            if [ "$encryption" = 'unset' ]; then
              echo "Compliance-only: declaring that build $BUILD_NUMBER does not use non-exempt encryption."
              build_patch=$(jq -cn --arg id "$build_id" '{data:{type:"builds",id:$id,attributes:{usesNonExemptEncryption:false}}}')
              asc_write PATCH "builds/$build_id" "$build_patch" > /dev/null
            elif [ "$encryption" = 'false' ]; then
              echo "Compliance-only: build $BUILD_NUMBER already declares exempt encryption; leaving it unchanged."
            else
              echo "::error::build $BUILD_NUMBER declares non-exempt encryption; refusing to overwrite it"
              exit 1
            fi
            for attempt in 1 2 3 4 5 6; do
              asc_get builds --data-urlencode "filter[app]=$app_id" --data-urlencode "filter[version]=$BUILD_NUMBER" --data-urlencode 'limit=10' > "$builds_json"
              asc_get buildBetaDetails --data-urlencode "filter[build]=$build_id" --data-urlencode 'limit=2' > "$details_json"
              internal_state=$(jq -r '.data[0].attributes.internalBuildState // "UNKNOWN"' "$details_json")
              echo "Compliance-only: usesNonExemptEncryption=$(jq -r '.data[0].attributes.usesNonExemptEncryption' "$builds_json") internalBuildState=$internal_state"
              [ "$internal_state" != 'MISSING_EXPORT_COMPLIANCE' ] && break
              sleep 5
            done
          fi

          if [ "$ENABLE_PUBLIC_TESTING" = 'true' ]; then
            group_id=$(jq -r --arg link "$PUBLIC_LINK_ID" '.data[] | select(.attributes.publicLinkId == $link) | .id' "$groups_json" | head -n 1)
            if [ -z "$group_id" ]; then
              echo "::error::public TestFlight group $PUBLIC_LINK_ID was not found"
              exit 1
            fi

            encryption=$(jq -r '
              if (.data[0].attributes.usesNonExemptEncryption | type) == "boolean"
              then (.data[0].attributes.usesNonExemptEncryption | tostring)
              else "unset"
              end
            ' "$builds_json")
            if [ "$encryption" = 'unset' ]; then
              echo "Declaring that build $BUILD_NUMBER does not use non-exempt encryption."
              build_patch=$(jq -cn --arg id "$build_id" '{data:{type:"builds",id:$id,attributes:{usesNonExemptEncryption:false}}}')
              asc_write PATCH "builds/$build_id" "$build_patch" > /dev/null
            elif [ "$encryption" = 'false' ]; then
              echo "Build $BUILD_NUMBER already declares exempt encryption; leaving it unchanged."
            else
              echo "::error::build $BUILD_NUMBER declares non-exempt encryption; refusing to overwrite it"
              exit 1
            fi

            group_builds="$RUNNER_TEMP/public-group-builds.json"
            asc_get "betaGroups/$group_id/relationships/builds" --data-urlencode 'limit=200' > "$group_builds"
            in_group=$(jq --arg build "$build_id" 'any(.data[]?; .id == $build)' "$group_builds")
            if [ "$in_group" = 'true' ]; then
              echo "Build $BUILD_NUMBER is already in the Public group; leaving membership unchanged."
            else
              echo "Adding build $BUILD_NUMBER to the existing Public external-testing group."
              group_link=$(jq -cn --arg id "$build_id" '{data:[{type:"builds",id:$id}]}')
              asc_write POST "betaGroups/$group_id/relationships/builds" "$group_link" > /dev/null
            fi

            for attempt in 1 2 3 4 5 6; do
              asc_get buildBetaDetails --data-urlencode "filter[build]=$build_id" --data-urlencode 'limit=2' > "$details_json"
              external_state=$(jq -r '.data[0].attributes.externalBuildState // "UNKNOWN"' "$details_json")
              echo "External build state after configuration: $external_state"
              case "$external_state" in
                READY_TO_SUBMIT|READY_FOR_BETA_SUBMISSION|WAITING_FOR_BETA_REVIEW|IN_BETA_TESTING|APPROVED) break ;;
              esac
              sleep 5
            done

            if [ "$external_state" = 'READY_TO_SUBMIT' ] || [ "$external_state" = 'READY_FOR_BETA_SUBMISSION' ]; then
              echo "Submitting build $BUILD_NUMBER for Beta App Review."
              review_submission=$(jq -cn --arg id "$build_id" '{data:{type:"betaAppReviewSubmissions",relationships:{build:{data:{type:"builds",id:$id}}}}}')
              asc_write POST betaAppReviewSubmissions "$review_submission" > /dev/null
            elif [ "$external_state" = 'WAITING_FOR_BETA_REVIEW' ] || [ "$external_state" = 'IN_BETA_TESTING' ] || [ "$external_state" = 'APPROVED' ]; then
              echo 'Beta App Review is already pending or complete; no duplicate submission was created.'
            else
              echo "::error::build is not ready for Beta App Review after configuration: $external_state"
              exit 1
            fi

            asc_get buildBetaDetails --data-urlencode "filter[build]=$build_id" --data-urlencode 'limit=2' > "$details_json"
            asc_get betaGroups --data-urlencode "filter[app]=$app_id" --data-urlencode 'limit=200' > "$groups_json"
          fi

          # Attach this build to named beta groups (or every internal group).
          # Groups with hasAccessToAllBuilds already receive every build and
          # Apple rejects a manual attach there, so they are only reported.
          # An external group still needs Beta App Review before testers see it.
          if [ "$DISTRIBUTE_TO_GROUPS" = 'all-internal' ]; then
            ASC_KEY_ID="$APPLE_API_KEY" ASC_ISSUER_ID="$APPLE_API_ISSUER" \
              ASC_KEY_BASE64="$APPLE_API_KEY_BASE64" \
              node ios-distribution-tools/scripts/ios-distribute-internal.mjs "$BUILD_NUMBER"
            DISTRIBUTE_TO_GROUPS=""
          fi
          if [ -n "$DISTRIBUTE_TO_GROUPS" ]; then
            processing=$(jq -r '.data[0].attributes.processingState // "UNKNOWN"' "$builds_json")
            if [ "$processing" != 'VALID' ]; then
              echo "::error::build $BUILD_NUMBER is $processing, not VALID; refusing to distribute"
              exit 1
            fi
            if [ "$DISTRIBUTE_TO_GROUPS" = 'all-internal' ]; then
              targets=$(jq -c '[.data[] | select(.attributes.isInternalGroup == true)]' "$groups_json")
            else
              targets=$(jq -c --arg want "$DISTRIBUTE_TO_GROUPS" '
                ($want | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $names
                | [.data[] | select(.attributes.name as $n | $names | index($n))]' "$groups_json")
              missing=$(jq -r --arg want "$DISTRIBUTE_TO_GROUPS" --argjson found "$targets" '
                $want | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))
                | map(select(. as $n | ($found | map(.attributes.name) | index($n)) | not)) | join(", ")' <<< '""')
              if [ -n "$missing" ]; then
                echo "::error::beta group(s) not found: $missing (dispatch with list_beta_groups=true to see the names)"
                exit 1
              fi
            fi
            if [ "$(jq 'length' <<< "$targets")" = '0' ]; then
              echo "::error::no beta group matched distribute_to_groups=$DISTRIBUTE_TO_GROUPS"
              exit 1
            fi
            while IFS= read -r group; do
              group_id=$(jq -r '.id' <<< "$group")
              group_name=$(jq -r '.attributes.name' <<< "$group")
              if [ "$(jq -r '.attributes.hasAccessToAllBuilds // false' <<< "$group")" = 'true' ]; then
                echo "Group '$group_name' has hasAccessToAllBuilds=true; it already receives build $BUILD_NUMBER."
                continue
              fi
              dist_builds="$RUNNER_TEMP/dist-group-builds.json"
              asc_get "betaGroups/$group_id/relationships/builds" --data-urlencode 'limit=200' > "$dist_builds"
              if [ "$(jq --arg build "$build_id" 'any(.data[]?; .id == $build)' "$dist_builds")" = 'true' ]; then
                echo "Build $BUILD_NUMBER is already in group '$group_name'."
              else
                echo "Adding build $BUILD_NUMBER to group '$group_name'."
                group_link=$(jq -cn --arg id "$build_id" '{data:[{type:"builds",id:$id}]}')
                asc_write POST "betaGroups/$group_id/relationships/builds" "$group_link" > /dev/null
              fi
            done < <(jq -c '.[]' <<< "$targets")
            asc_get buildBetaDetails --data-urlencode "filter[build]=$build_id" --data-urlencode 'limit=2' > "$details_json"
            echo "After distribution: internalBuildState=$(jq -r '.data[0].attributes.internalBuildState // "UNKNOWN"' "$details_json") externalBuildState=$(jq -r '.data[0].attributes.externalBuildState // "UNKNOWN"' "$details_json")"
          fi

          reviews_json="$RUNNER_TEMP/reviews.json"
          asc_get betaAppReviewSubmissions --data-urlencode "filter[build]=$build_id" --data-urlencode 'limit=10' > "$reviews_json"

          memberships="$RUNNER_TEMP/memberships.jsonl"
          : > "$memberships"
          while IFS= read -r group; do
            group_id=$(jq -r '.id' <<< "$group")
            group_name=$(jq -r '.attributes.name' <<< "$group")
            public_enabled=$(jq -r '.attributes.publicLinkEnabled // false' <<< "$group")
            public_id=$(jq -r '.attributes.publicLinkId // ""' <<< "$group")
            limit_enabled=$(jq -r '.attributes.publicLinkLimitEnabled // false' <<< "$group")
            tester_limit=$(jq -r '.attributes.publicLinkLimit // 0' <<< "$group")
            rel_json="$RUNNER_TEMP/group-$group_id-builds.json"
            asc_get "betaGroups/$group_id/relationships/builds" --data-urlencode 'limit=200' > "$rel_json"
            contains_build=$(jq --arg build "$build_id" 'any(.data[]?; .id == $build)' "$rel_json")
            jq -cn \
              --arg id "$group_id" \
              --arg name "$group_name" \
              --arg publicLinkId "$public_id" \
              --argjson publicLinkEnabled "$public_enabled" \
              --argjson publicLinkLimitEnabled "$limit_enabled" \
              --argjson publicLinkLimit "$tester_limit" \
              --argjson containsBuild "$contains_build" \
              '{id:$id,name:$name,publicLinkEnabled:$publicLinkEnabled,publicLinkId:$publicLinkId,publicLinkLimitEnabled:$publicLinkLimitEnabled,publicLinkLimit:$publicLinkLimit,containsBuild:$containsBuild}' \
              >> "$memberships"
          done < <(jq -c '.data[]' "$groups_json")

          if [ "$LIST_BETA_GROUPS" = 'true' ]; then
            echo 'Beta groups (names and flags only; testers intentionally omitted):'
            jq --slurpfile memberships "$memberships" '
              [.data[] | . as $g | {
                name: .attributes.name,
                isInternalGroup: (.attributes.isInternalGroup // false),
                hasAccessToAllBuilds: (.attributes.hasAccessToAllBuilds // false),
                publicLinkEnabled: (.attributes.publicLinkEnabled // false),
                containsBuild: ([$memberships[] | select(.id == $g.id) | .containsBuild] | first // false)
              }]' "$groups_json"
          fi

          echo 'TestFlight status (credentials and JWT intentionally omitted):'
          jq -n \
            --arg bundleId "$BUNDLE_ID" \
            --arg buildNumber "$BUILD_NUMBER" \
            --arg publicLinkId "$PUBLIC_LINK_ID" \
            --slurpfile builds "$builds_json" \
            --slurpfile details "$details_json" \
            --slurpfile reviews "$reviews_json" \
            --slurpfile memberships "$memberships" \
            '{
              bundleId: $bundleId,
              buildNumber: $buildNumber,
              build: ($builds[0].data[0] | {id, attributes}),
              betaDetail: ($details[0].data[0] // null),
              betaReviewSubmissions: [$reviews[0].data[]? | {id, attributes}],
              matchingPublicGroup: ([$memberships[] | select(.publicLinkId == $publicLinkId)] | first // null),
              allExternalGroups: [$memberships[] | select(.publicLinkId != "")]
            }'
