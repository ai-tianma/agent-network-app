name: task execution receipt
on:
  pull_request:
    paths: ['src/**', 'tests/task-execution/**', '.github/workflows/task-execution.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/task-execution/**', '.github/workflows/task-execution.yml']
jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: docker build -f tests/task-execution/Dockerfile -t task-execution .
      - run: docker run --rm --network none task-execution
