# China download mirror: copies every published desktop-v* release to the public ModelScope
# dataset SmartFlowAI/agent-network-releases (desktop/<ver>/ + desktop/latest/).
# Layout, update pointer and the updater fallback are described in
# docs/desktop-release-sop.md section 10 and at the top of scripts/modelscope-mirror.mjs.
#
# Why three triggers:
#   * release: published  — the normal path. Starts as soon as the draft is published.
#     The Android APK is attached to the release by hand a few minutes AFTER publishing,
#     and GitHub fires no workflow event for an asset upload (`release: edited` is only
#     for title/body/flag edits). So this run waits up to 30 min for the APK, then mirrors
#     whatever is there.
#   * schedule            — reconcile. Every 30 min, compare the newest published release
#     against the mirror by sha256 (GitHub asset digests vs the ModelScope listing) and
#     upload only what differs. In sync = two API calls, no download, no commit. This is what
#     catches an APK attached late, a run that failed half way, or a ModelScope outage.
#   * workflow_dispatch   — re-sync any past release by tag. An old tag never moves
#     desktop/latest/ (only the newest published release does).
name: modelscope mirror

on:
  release:
    types: [published]
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full40 main source SHA of the published release (required for manual mirroring)'
        required: true
        type: string
      tag:
        description: 'Release tag to (re)sync, e.g. desktop-v0.2.98. Empty = newest published desktop release.'
        required: false
        type: string

permissions:
  contents: read
  actions: write

# One mirror run at a time, across all triggers: two runs committing the same files to the
# dataset concurrently is the one race this design has. GitHub keeps at most ONE pending run
# per group — a newer pending run replaces an older pending one. For cron runs that is
# harmless (they are equivalent); when re-syncing several old tags by hand, dispatch the next
# one after the previous run has started.
concurrency:
  group: modelscope-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Bind the published release to an immutable main source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              | awk '/^desktop-v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -1)
          fi
          [[ "$TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          [[ $(jq -r .draft <<<"$release") == false ]]
          source=$(jq -r .target_commitish <<<"$release")
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$REQUESTED_COMMIT" ]; then [[ "$source" == "$REQUESTED_COMMIT" ]]; fi
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")")
          fi
          [[ $(jq -r .object.type <<<"$ref") == commit ]]
          [[ $(jq -r .object.sha <<<"$ref") == "$source" ]]
          echo "commit=$source" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
      - name: Verify the exact release source is still on main
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

      - name: Install ModelScope SDK (pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ms"
          "$RUNNER_TEMP/ms/bin/pip" install --disable-pip-version-check --quiet 'modelscope==1.40.1'
          "$RUNNER_TEMP/ms/bin/python" -c 'import modelscope; print("modelscope", modelscope.__version__)'

      - name: List what the mirror holds (anonymous)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ms/bin/python" scripts/modelscope-mirror-upload.py list --out "$RUNNER_TEMP/remote.json"

      - name: Plan and stage changed files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          WAIT_APK_MINUTES: ${{ github.event_name == 'release' && '30' || '0' }}
        run: |
          set -euo pipefail
          node scripts/modelscope-mirror.mjs prepare \
            --remote "$RUNNER_TEMP/remote.json" \
            --out "$RUNNER_TEMP/mirror" \
            --tag "$TAG" \
            --wait-apk-minutes "$WAIT_APK_MINUTES"

      - name: Upload (one commit) and verify anonymously
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ms/bin/python" scripts/modelscope-mirror-upload.py upload --dir "$RUNNER_TEMP/mirror"

      - name: Summary
        if: always()
        run: |
          f="$RUNNER_TEMP/mirror/summary.json"
          if [ -f "$f" ]; then
            {
              echo '### ModelScope mirror'
              echo '```json'
              jq '{tag, isNewest, newest, planned, changed}' "$f"
              echo '```'
              echo "Browse: https://modelscope.cn/datasets/SmartFlowAI/agent-network-releases/files"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # iOS goes last: only after the newest desktop release is on the mirror.
  # Cron reconciles must not upload another TestFlight build.
  dispatch-ios:
    needs: mirror
    if: github.event_name != 'schedule' && needs.mirror.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch ios-build for the newest published desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | awk '/^desktop-v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -1)
          tag="${REQUESTED_TAG:-$newest}"
          if [ "$tag" != "$newest" ]; then
            echo "tag $tag is not the newest desktop release ($newest); not dispatching iOS"
            exit 0
          fi
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          sha=$(jq -r .object.sha <<<"$ref")
          if [ "$(jq -r .object.type <<<"$ref")" = "tag" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "dispatch ios-build commit=$sha tag=$tag"
          gh workflow run ios-build.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "commit=$sha" -f "upload_testflight=true"
