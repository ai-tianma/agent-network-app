[package]
name = "agent-network-desktop"
version = "0.2.281"
description = "Agent Network desktop shell — Tauri 2 over the RN-web export"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
atomicwrites = "0.4"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] } # 0.2.76: 系统栏托盘 + include_image!(PNG)
# Hub requests over one pooled client (src/hub_http.rs). Same reqwest line and features as
# tauri-plugin-http below, so TLS / proxy / gzip behave identically — only the pool is new.
reqwest_pool = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "macos-system-configuration", "gzip"] }
tauri-plugin-http = { version = "2", features = ["gzip"] } # 2026-09-16: hub 对 Accept-Encoding: gzip 压缩 JSON,reqwest 要开 gzip 才会请求并解压
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
scrypt = { version = "0.11", default-features = false }
base64 = "0.22"
sha2 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2" # 0.2.76: 新消息系统通知(飞书式)
notify-rust = { version = "=4.18.0", default-features = false, features = ["preview-macos-un"] } # macOS 用 UNUserNotificationCenter,避开旧库主线程轮询。
tauri-plugin-clipboard-manager = "2" # 2026-09-27: 图片预览窗口 Ctrl/⌘+C 复制图片本身(writeImage 吃 PNG 字节,靠上面 tauri 的 image-png)

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# A session Secret Service provides persistence; the default keyring backend is
# mock memory when no Linux feature is selected. Encrypt secrets on the bus.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
